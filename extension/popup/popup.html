<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="20" height="20">
    <h1>VidGrab</h1>
    <span id="host-badge" class="pill">…</span>
    <button id="settings" class="icon" title="Settings">⚙</button>
  </header>

  <section id="setup" hidden>
    <p><strong>Native helper not found.</strong> VidGrab needs a small helper program and yt-dlp installed on your computer.</p>
    <p>From the project folder run:</p>
    <pre>./install.sh --fetch-ytdlp</pre>
    <p class="muted" id="setup-error"></p>
    <button id="retry">Check again</button>
  </section>

  <section id="main">
    <div class="page">
      <div id="page-title" class="title"></div>
      <div id="page-url" class="muted url"></div>
    </div>
    <div class="row">
      <select id="preset"></select>
      <button id="download" class="primary">Download</button>
    </div>
  </section>

  <section id="media-section" hidden>
    <h2>Detected media streams</h2>
    <ul id="media"></ul>
  </section>

  <section>
    <div class="section-head">
      <h2>Downloads</h2>
      <button id="clear" class="link">Clear finished</button>
    </div>
    <ul id="jobs"><li class="muted empty">Nothing yet.</li></ul>
  </section>

  <footer>
    <button id="open-folder" class="link">Open download folder</button>
  </footer>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
